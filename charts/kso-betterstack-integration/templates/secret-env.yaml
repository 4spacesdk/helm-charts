{{/*
deployment.secretEnv - the API tokens and the like - in a Secret, so they are not in the
Deployment for anyone who may read it.
*/}}
{{- if .Values.deployment.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kso.fullname" . }}-env
  labels:
    {{- include "kso.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.deployment.secretEnv }}
  {{ .name }}: {{ .value | quote }}
  {{- end }}
{{- end }}
