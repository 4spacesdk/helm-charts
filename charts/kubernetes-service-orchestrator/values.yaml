# Default values for kso.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 4spaces/kubernetes-service-orchestrator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Select a cloud provider. This will enable provider-specific resources.
# "gke" also grants kso RBAC to manage HealthCheckPolicies and GCPBackendPolicies (networking.gke.io)
# for the services it orchestrates - so non-HTTP ports such as websockets stay healthy, and backend
# request timeouts can be raised above GKE's 30s default, behind a GKE Gateway.
provider: ""          # "gke" | "aks" | "eks" | ""

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

deployment:

  # Valid values: development, production
  # development will show errors, production will not
  environment: ""

  # You need to provide a MySQL database
  database:
    host: ""
    port: "3306"
    name: ""
    user: ""
    pass: ""

  # Required. What the credentials kso stores for other systems - registry passwords,
  # database passwords, webhook tokens - are encrypted with, along with the refresh-token
  # cookie. Any 32 characters will do, but it has to be this installation's own and it has
  # to stay the same: change it and the stored credentials cannot be read back.
  # Generate one on Linux or macOS with:  openssl rand -base64 24
  encryptionKey: ""

  # Old keys, comma separated. Set this when rotating encryptionKey, so what the old one
  # encrypted can still be read until `php spark app:reencrypt` has written it again.
  previousEncryptionKeys: ""

  # A Secret of your own to read the passwords and the encryption key from, instead of the
  # one this chart makes from database.pass, encryptionKey, previousEncryptionKeys and
  # config.email.pass - for External Secrets, Sealed Secrets and the like, so the values
  # never have to be in values at all. Keys: db-pass, encryption-key, and optionally
  # encryption-previous-keys and email-pass.
  existingSecret: ""

  # kso scans the images your deployments run for known vulnerabilities, every night, with
  # Trivy. Its databases are kept on a volume of this size between scans: 1.3 GB, plus 1.4 GB
  # once an image with Java in it has been scanned. They are fetched again when the pod starts.
  imageScanning:
    cacheSizeLimit: 4Gi

  # The default url is "https://kubernetes.default.svc.cluster.local".
  # But it can be different depending on provider
  kubernetes:
    remoteClusterUrl: "https://kubernetes.default.svc.cluster.local"

  config:
    defaults:
      imagePullSecretName: ""
      certManagerIssuerName: ""

    # Serve Swagger - the API documentation page and the description of every endpoint it
    # reads - at /api/swagger. Both answer without a sign-in, so it is off unless turned on.
    swaggerEnabled: false

    # Hostnames kso is also reached on that none of the routings below know about - an ingress
    # made outside this chart, say. kso answers only on the routing hosts and these; a request
    # naming any other host gets absolute urls with the first routing host.
    extraHostnames: [ ]

    # Enable email features. Used for "forgot password". This is optional.
#    email:
#      host: ""
#      port: ""
#      user: ""
#      pass: ""
#      sender: ""

  env: [ ]
#  env:
#    - name: ""
#      value: ""

migration:

  # How long the migration job may run before Kubernetes fails it, in seconds.
  #
  # The deployment waits on this job through an init container, so a job that never
  # finishes blocks the whole rollout for as long as this value allows. Keep it long
  # enough for the slowest migration you expect, and short enough that a stuck job is
  # noticed rather than sat through. Raise it if you have a large database and a
  # migration that rewrites rows.
  activeDeadlineSeconds: 1800

serviceAccount:
  # Annotations to add to the service account
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: { }
podLabels: { }

podSecurityContext: { }
# fsGroup: 2000

securityContext: { }
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  annotations: { }
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: [ ]
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

istio:
  enabled: false
  hosts:
    - chart-example.local
  gateway:
    enabled: false
    selector:
      istio: ingressgateway
    tls:
      enabled: false
      secretName: chart-example-tls
  virtualservice:
    enabled: false

contour:
  enabled: false
  className: contour-external
  host: chart-example.local
  tls:
    enabled: false
    secretName: chart-example-tls

gatewayapi:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
#    - name: gateway-external
#      namespace: gateway-system
  hosts:
    - chart-example.local
  healthCheckPolicy:
    enabled: true

# Measured: about 90Mi idle - Apache, PHP and the zmq server - and 110-180Mi more while
# Trivy scans an image, one at a time. An image with many layers or Java in it takes more,
# and so does the first scan after a start, which fetches Trivy's databases. The limit leaves
# room for that. Trivy's databases are read through the page cache, which counts towards the
# limit but is given back before the pod is killed.
# No CPU limit: a scan is short and CPU-bound, and a limit only makes it slower.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# The push server, a sidecar in kso's pod: it sends kso's events to the open browsers.
centrifugo:
  image:
    tag: v6.9.6
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Lets kso manage Knative Services, for deployment specifications that run as one. Needs
# Knative Serving installed in the cluster.
knative:
  enabled: false

clusterrole: {}
