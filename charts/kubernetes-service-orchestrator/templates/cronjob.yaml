apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kso.fullname" . }}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            # What the NetworkPolicy admits it by. Not kso's selector labels, which would put
            # this pod behind kso's Service.
            kso.4spaces.dk/role: cron
        spec:
          # It only calls kso over http, and needs nothing from the cluster.
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: callout
              image: "curlimages/curl:{{ .Values.cronjob.image.tag }}"
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 100
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              # The endpoint runs every cron job in the installation, so it asks who is
              # calling. The token is the one kso is given, from the same Secret.
              #
              # `-f` so a refusal fails the job: without it curl exits 0 on a 401 and the
              # scheduler would quietly stop running anything, with nothing to see.
              env:
                - name: CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kso.fullname" . }}-cron
                      key: cron-token
              # command, not args: the image's entrypoint is curl itself.
              command:
                - /bin/sh
                - -ec
                # Quoted whole: unquoted, the `: ` in the header made YAML read the line as a map, and
                # the api server refused the CronJob - "cannot unmarshal object into ... command".
                - 'curl -fsS -H "X-Cron-Token: $CRON_TOKEN" {{ include "kso.fullname" . }}.{{ .Release.Namespace }}/api/jobby'
          restartPolicy: Never
