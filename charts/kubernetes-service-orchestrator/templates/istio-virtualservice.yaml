{{- if .Values.istio.virtualservice.enabled -}}
{{- $fullName := include "kso.fullname" . -}}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ $fullName }}
spec:
  gateways:
    - {{ .Release.Namespace }}/{{ $fullName }}
  hosts:
    {{- range .Values.istio.hosts }}
    - {{ . | quote }}
    {{- end }}
  http:
    - match:
        - uri:
            prefix: /connection
      route:
        - destination:
            host: {{ $fullName }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8000
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ $fullName }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
{{- end }}
