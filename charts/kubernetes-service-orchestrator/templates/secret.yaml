{{/*
The token the scheduler proves itself with when it calls /api/jobby.

`GET /api/jobby` runs every cron job in the installation, and it used to answer anyone who
could reach the API. The caller is the CronJob below - a curl container inside the cluster,
with nobody to sign it in - so a value both sides are given stands in for a login.

Generated here rather than asked of the operator: it protects one endpoint, nothing stored
depends on it, and a value nobody has to choose is a value nobody leaves at its default.

`lookup` keeps it: on an upgrade the existing Secret is read and its value reused, so the
token does not change and the pods are not rolled for it. `lookup` returns nothing on
`helm template` and on a dry run, and a fresh one is generated then - which is correct,
because that output is not what runs.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-cron" (include "kso.fullname" .))) -}}
{{- $token := "" -}}
{{- if $existing -}}
{{- $token = index $existing.data "cron-token" | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kso.fullname" . }}-cron
  labels:
    {{- include "kso.labels" . | nindent 4 }}
type: Opaque
stringData:
  cron-token: {{ $token | quote }}
