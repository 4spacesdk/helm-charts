apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kso.fullname" . }}
  labels:
    {{- include "kso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "kso.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The push API key is read from a Secret too; a new one rolls the pods, so kso and the
        # sidecar never disagree about it.
        checksum/push: {{ include (print $.Template.BasePath "/secret-push.yaml") . | sha256sum }}
        {{- if not .Values.deployment.existingSecret }}
        # Values read from a Secret are not reloaded; a changed password rolls the pods.
        checksum/credentials: {{ include (print $.Template.BasePath "/secret-credentials.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kso.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kso.serviceAccountName" . }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-migration
          image: ghcr.io/groundnuty/k8s-wait-for:v2.0
          imagePullPolicy: IfNotPresent
          args:
            - job
            - {{ include "kso.fullname" . }}-migration-{{ .Values.image.tag | default .Chart.AppVersion | replace "." "-" }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: "4spaces/kubernetes-service-orchestrator:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent"  }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.deployment.environment | default "production" }}
              {{- if .Values.ingress.enabled }}
              {{- if .Values.ingress.hosts }}
              {{- with first .Values.ingress.hosts }}
            - name: BASE_URL
              value: https://{{ .host }}
            - name: CENTRIFUGO_EXTERNAL_URL
              value: wss://{{ .host }}/connection/websocket
              {{- end }}
              {{- end }}
              {{- end }}
              {{- if .Values.istio.enabled }}
              {{- if .Values.istio.hosts }}
              {{- with first .Values.istio.hosts }}
            - name: BASE_URL
              value: https://{{ .host }}
            - name: CENTRIFUGO_EXTERNAL_URL
              value: wss://{{ .host }}/connection/websocket
              {{- end }}
              {{- end }}
              {{- end }}
              {{- if .Values.contour.enabled }}
              {{- if .Values.contour.host }}
            - name: BASE_URL
              value: https://{{ .Values.contour.host }}
            - name: CENTRIFUGO_EXTERNAL_URL
              value: wss://{{ .Values.contour.host }}/connection/websocket
              {{- end }}
              {{- end }}
              {{- if .Values.gatewayapi.enabled }}
              {{- if .Values.gatewayapi.hosts }}
              {{- with first .Values.gatewayapi.hosts }}
            - name: BASE_URL
              value: https://{{ . }}
            - name: CENTRIFUGO_EXTERNAL_URL
              value: wss://{{ . }}/connection/websocket
              {{- end }}
              {{- end }}
              {{- end }}
            - name: DB_HOST
              value: {{ required "Database is required" .Values.deployment.database.host | quote }}
            - name: DB_PORT
              value: {{ required "Database is required" .Values.deployment.database.port | quote }}
            - name: DB_NAME
              value: {{ required "Database is required" .Values.deployment.database.name | quote }}
            - name: DB_USER
              value: {{ required "Database is required" .Values.deployment.database.user | quote }}
            {{- include "kso.credentialsEnv" . | nindent 12 }}
            - name: CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kso.fullname" . }}-cron
                  key: cron-token
            # The Centrifugo sidecar below, which kso publishes to on its internal port.
            - name: CENTRIFUGO_API_URL
              value: http://localhost:9000/api
            - name: CENTRIFUGO_HTTP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kso.fullname" . }}-push
                  key: api-key
            - name: KUBERNETES_AUTH
              value: in-cluster
            - name: REMOTE_CLUSTER_URL
              value: {{ required "You need to provide a remote cluster url" .Values.deployment.kubernetes.remoteClusterUrl }}
            {{- if .Values.deployment.config.defaults.imagePullSecretName }}
            - name: IMAGE_PULL_SECRET_DEFAULT_NAME
              value: {{ .Values.deployment.config.defaults.imagePullSecretName }}
            {{- end}}
            {{- if .Values.deployment.config.defaults.certManagerIssuerName }}
            - name: CERT_MANAGER_ISSUER_DEFAULT_NAME
              value: {{ .Values.deployment.config.defaults.certManagerIssuerName }}
            {{- end}}
            {{- with include "kso.allowedHostnames" . }}
            - name: ALLOWED_HOSTNAMES
              value: {{ . | quote }}
            {{- end }}
            - name: TRIVY_CACHE_DIR
              value: /var/cache/kso-trivy
            {{- if .Values.deployment.config.swaggerEnabled }}
            - name: SWAGGER_ENABLED
              value: "true"
            {{- end}}
            {{- range .Values.deployment.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end}}
            {{- if .Values.deployment.config.email }}
            - name: EMAIL_SERVICE_HOST
              value: {{ .Values.deployment.config.email.host | quote }}
            - name: EMAIL_SERVICE_PORT
              value: {{ .Values.deployment.config.email.port | quote }}
            - name: EMAIL_SERVICE_USER
              value: {{ .Values.deployment.config.email.user | quote }}
            - name: EMAIL_SERVICE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "kso.credentialsSecretName" . }}
                  key: email-pass
                  optional: true
            - name: EMAIL_SERVICE_SENDER
              value: {{ .Values.deployment.config.email.sender | quote }}
            {{- end}}
          # Trivy's vulnerability databases, kept between the nightly image scans: 1.3 GB, and
          # 1.4 GB more once an image with Java in it has been scanned. A volume of its own so the
          # size is limited and shows up as the pod's, instead of filling the node unnoticed.
          volumeMounts:
            - name: trivy-cache
              mountPath: /var/cache/kso-trivy
        # Pushes kso's events to the browsers. Browsers connect on 8000, through /connection on
        # the routing, with the access token they signed in with - checked against kso's key
        # set, from kso's own container next to it - and may only subscribe, to any channel.
        # kso publishes on 9000, which is not in the Service. A sidecar because there is one kso
        # replica: with more, each pod would push only to the browsers connected to its own
        # sidecar, and Centrifugo would have to move to a Deployment of its own.
        - name: centrifugo
          image: "centrifugo/centrifugo:{{ .Values.centrifugo.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - centrifugo
          ports:
            - name: push
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.centrifugo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CENTRIFUGO_HTTP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kso.fullname" . }}-push
                  key: api-key
            - name: CENTRIFUGO_CLIENT_TOKEN_JWKS_PUBLIC_ENDPOINT
              value: http://localhost/api/openidconfiguration/jwks
            # The OAuth client kso's own app signs in as; a token issued to another client is
            # not for this.
            - name: CENTRIFUGO_CLIENT_TOKEN_AUDIENCE
              value: webclient
            - name: CENTRIFUGO_CLIENT_ALLOWED_ORIGINS
              value: {{ include "kso.pushAllowedOrigins" . | quote }}
            - name: CENTRIFUGO_HTTP_SERVER_INTERNAL_PORT
              value: "9000"
            - name: CENTRIFUGO_HEALTH_ENABLED
              value: "true"
            # Subscribe for anyone with a token, publish for no one, and the last few messages
            # of each channel kept for five minutes, so a browser that reconnects gets what it
            # missed.
            - name: CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_ALLOW_SUBSCRIBE_FOR_CLIENT
              value: "true"
            - name: CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_SIZE
              value: "10"
            - name: CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_TTL
              value: 300s
            - name: CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_FORCE_RECOVERY
              value: "true"
      volumes:
        - name: trivy-cache
          emptyDir:
            sizeLimit: {{ .Values.deployment.imageScanning.cacheSizeLimit | default "4Gi" }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
