{{/*
The API key kso publishes to its Centrifugo sidecar with.

Generated here for the same reasons as the cron token: nothing stored depends on it, and a value
nobody has to choose is a value nobody leaves at its default. `lookup` keeps it across upgrades.
*/}}
{{- $name := printf "%s-push" (include "kso.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $apiKey := "" -}}
{{- if $existing -}}
{{- $apiKey = index $existing.data "api-key" | b64dec -}}
{{- else -}}
{{- $apiKey = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kso.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $apiKey | quote }}
