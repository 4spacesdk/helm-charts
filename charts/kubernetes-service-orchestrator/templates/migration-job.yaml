apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kso.fullname" . }}-migration-{{ .Values.image.tag | default .Chart.AppVersion | replace "." "-" }}
  labels:
    {{- include "kso.labels" . | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds | default 1800 }}
  template:
    metadata:
      labels:
        app: {{ include "kso.fullname" . }}
        role: migration
    spec:
      serviceAccountName: {{ include "kso.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "4spaces/kubernetes-service-orchestrator:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent"  }}
          command:
            - /bin/sh
          args:
            - -c
            - cd /var/www/html/ci4 && php spark migrate
          env:
            - name: ENVIRONMENT
              value: {{ .Values.deployment.environment | default "production" }}
              {{- if .Values.ingress.enabled }}
              {{- if .Values.ingress.hosts }}
              {{- with first .Values.ingress.hosts }}
            - name: BASE_URL
              value: https://{{ .host }}
            - name: ZMQ_EXTERNAL_URL
              value: wss://{{ .host }}/socket
              {{- end }}
              {{- end }}
              {{- end }}
              {{- if .Values.istio.enabled }}
              {{- if .Values.istio.hosts }}
              {{- with first .Values.istio.hosts }}
            - name: BASE_URL
              value: https://{{ .host }}
            - name: ZMQ_EXTERNAL_URL
              value: wss://{{ .host }}/socket
              {{- end }}
              {{- end }}
              {{- end }}
              {{- if .Values.contour.enabled }}
              {{- if .Values.contour.host }}
            - name: BASE_URL
              value: https://{{ .Values.contour.host }}
            - name: ZMQ_EXTERNAL_URL
              value: wss://{{ .Values.contour.host }}/socket
              {{- end }}
              {{- end }}
              {{- if .Values.gatewayapi.enabled }}
              {{- if .Values.gatewayapi.hosts }}
              {{- with first .Values.gatewayapi.hosts }}
            - name: BASE_URL
              value: https://{{ . }}
            - name: ZMQ_EXTERNAL_URL
              value: wss://{{ . }}/socket
              {{- end }}
              {{- end }}
              {{- end }}
            - name: DB_HOST
              value: {{ required "Database is required" .Values.deployment.database.host }}
            - name: DB_PORT
              value: "{{ required "Database is required" .Values.deployment.database.port }}"
            - name: DB_NAME
              value: {{ required "Database is required" .Values.deployment.database.name }}
            - name: DB_USER
              value: {{ required "Database is required" .Values.deployment.database.user }}
            - name: DB_PASS
              value: {{ required "Database is required" .Values.deployment.database.pass }}
            - name: ENCRYPTION_KEY
              value: {{ required "An encryption key is required. It is what the credentials kso stores for other systems are encrypted with, and it has to stay the same for the life of the installation - losing it means those credentials cannot be read back." .Values.deployment.encryptionKey }}
            {{- if .Values.deployment.previousEncryptionKeys }}
            - name: ENCRYPTION_PREVIOUS_KEYS
              value: {{ .Values.deployment.previousEncryptionKeys | quote }}
            {{- end }}
      restartPolicy: OnFailure
