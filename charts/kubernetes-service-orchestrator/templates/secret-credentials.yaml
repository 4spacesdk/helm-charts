{{/*
The passwords and the encryption key, made from values - unless deployment.existingSecret
names a Secret the operator provides, with the same keys: db-pass, encryption-key and,
optionally, encryption-previous-keys and email-pass.
*/}}
{{- if not .Values.deployment.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kso.credentialsSecretName" . }}
  labels:
    {{- include "kso.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-pass: {{ required "Database is required" .Values.deployment.database.pass | quote }}
  encryption-key: {{ required "An encryption key is required. It is what the credentials kso stores for other systems are encrypted with, and it has to stay the same for the life of the installation - losing it means those credentials cannot be read back." .Values.deployment.encryptionKey | quote }}
  {{- if .Values.deployment.previousEncryptionKeys }}
  encryption-previous-keys: {{ .Values.deployment.previousEncryptionKeys | quote }}
  {{- end }}
  {{- if and .Values.deployment.config.email .Values.deployment.config.email.pass }}
  email-pass: {{ .Values.deployment.config.email.pass | quote }}
  {{- end }}
{{- end }}
